[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wmmllm"
version = "0.1.0"
description = "An agentic interactive world model with persistent panorama state"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "opencv-python-headless>=4.8",
  "scipy>=1.10",
  "openai>=2.53,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://baiangli.com/wmmllm/"
Repository = "https://github.com/ztMotaLee/WM_mllm"
Issues = "https://github.com/ztMotaLee/WM_mllm/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wmmllm = "wmmllm.cli:main"

[tool.setuptools]
include-package-data = false
packages = ["wmmllm", "wmmllm.agent", "wmmllm.memory", "wmmllm.prompts", "wmmllm.providers", "wmmllm.session", "wmmllm.state", "wmmllm.video"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"wmmllm.prompts" = ["*.txt", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider"
